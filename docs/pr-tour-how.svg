<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="960" height="533" role="img" aria-label="How pr-tour works: gather, map, prove, question, build. Prove breaks the fix on purpose and reruns the specs: a red test means the mutant was caught, all green means it escaped and there is a test gap. Every claim carries one of five evidence tags.">
  <style>
    .s1 { stop-color: #FFE8F1 } .s2 { stop-color: #EAE6FF } .dot { fill: #FFFFFF; fill-opacity: .95 }
    .card { fill: #FFFFFF } .frame { stroke: #F5BED6 } .shadow { fill: #F3D3E3 }
    .ink { fill: #3A2E4D } .ink-2 { fill: #6B5E86 } .ink-3 { fill: #A79BC0 } .ink-s { stroke: #3A2E4D }
    .pink { fill: #FF5D99 } .pink-s { stroke: #FF5D99 } .pink-deep { fill: #D93F7B } .pink-shadow { fill: #FFC7DC } .on-pink { fill: #FFFFFF }
    .lilac { fill: #9C86F2 } .gold { fill: #E8A400 } .soft-s { stroke: #D7A8C9 }
    .proof { fill: #14806F } .proof-soft { fill: #D8F5EC } .gap { fill: #CF4A22 } .gap-s { stroke: #CF4A22 } .gap-soft { fill: #FFE3D6 }
    .read-soft { fill: #FFF6FA } .read-s { stroke: #F0E2EE } .on-dot { fill: #FFFFFF }
    .fur { fill: #FFFDF8 } .fur-s { stroke: #FFFDF8 } .cat-line { stroke: #3A2E4D } .cat-pink { fill: #FFB3CF } .patch { fill: #F7B267 }
    text { font-family: "M PLUS Rounded 1c", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif }
    .pop { font-family: "Mochiy Pop One", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 800 }
    .b { font-weight: 800 } .m { font-weight: 500 }
    @media (prefers-color-scheme: dark) {
      .s1 { stop-color: #1A1430 } .s2 { stop-color: #2B1E47 } .dot { fill-opacity: .16 }
      .card { fill: #241B3A } .frame { stroke: #6B4C8F } .shadow { fill: #3A2A57 }
      .ink { fill: #F6F0FF } .ink-2 { fill: #C9BCE6 } .ink-3 { fill: #8B7DB0 } .ink-s { stroke: #C9BCE6 }
      .pink { fill: #FF7FB0 } .pink-s { stroke: #FF7FB0 } .pink-deep { fill: #B8467A } .pink-shadow { fill: #5A2E52 } .on-pink { fill: #1A1430 }
      .lilac { fill: #A895FF } .gold { fill: #FFD36B } .soft-s { stroke: #7A5C9E }
      .proof { fill: #6EE0C6 } .proof-soft { fill: #173A36 } .gap { fill: #FF9E7D } .gap-s { stroke: #FF9E7D } .gap-soft { fill: #45261F }
      .read-soft { fill: #2B2145 } .read-s { stroke: #3A2E58 } .on-dot { fill: #1A1430 }
      .fur { fill: #FFF4E6 } .fur-s { stroke: #FFF4E6 } .cat-line { stroke: #2A1F40 } .cat-pink { fill: #FF9DC2 } .patch { fill: #F0A458 }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.6" class="dot"/></pattern>
    <marker id="soft-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D7A8C9"/></marker>
    <marker id="ink-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8B7DB0"/></marker>
    <marker id="pink-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF5D99"/></marker>
    <clipPath id="head"><ellipse cx="100" cy="98" rx="76" ry="62"/></clipPath>
  </defs>

  <rect width="1440" height="800" rx="24" fill="url(#sky)"/>
  <rect width="1440" height="800" rx="24" fill="url(#dots)"/>

  <text class="pop pink" x="64" y="100" font-size="40">How pr-tour works</text>
  <text class="m ink-2" x="64" y="146" font-size="18">From a PR link to one review page, where every claim says how it was proven.</text>

  <!-- Mochi and her line -->
  <rect class="card frame" x="972" y="62" width="246" height="72" rx="20" stroke-width="2.5"/>
  <path class="card" d="M1214 86 L1232 98 L1214 110 Z"/>
  <path class="frame" d="M1217 88 L1232 98 L1217 108" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
  <text class="b ink" font-size="14.5"><tspan x="990" y="93">I break the fix on purpose,</tspan><tspan x="990" y="116">so you don't have to guess!</tspan></text>
  <g transform="translate(1232 26) scale(.76)" stroke-linecap="round" stroke-linejoin="round">
    <path class="cat-line" d="M150 170 C192 166 194 120 170 110" fill="none" stroke-width="15"/>
    <path class="fur-s" d="M150 170 C192 166 194 120 170 110" fill="none" stroke-width="7"/>
    <ellipse class="fur cat-line" cx="100" cy="166" rx="56" ry="30" stroke-width="4"/>
    <ellipse class="fur cat-line" cx="80" cy="190" rx="13" ry="9" stroke-width="3.5"/>
    <ellipse class="fur cat-line" cx="120" cy="190" rx="13" ry="9" stroke-width="3.5"/>
    <path class="fur cat-line" d="M40 72 L34 18 Q36 13 41 16 L84 46 Z M160 72 L166 18 Q164 13 159 16 L116 46 Z" stroke-width="4"/>
    <path class="cat-pink" d="M47 60 L43 30 L70 48 Z M153 60 L157 30 L130 48 Z"/>
    <ellipse class="fur" cx="100" cy="98" rx="76" ry="62"/>
    <path class="patch" d="M108 28 C150 24 186 58 176 96 C150 86 122 72 108 28 Z" clip-path="url(#head)"/>
    <ellipse class="cat-line" cx="100" cy="98" rx="76" ry="62" fill="none" stroke-width="4"/>
    <path class="pink cat-line" d="M52 40 L34 29 L36 53 Z M52 40 L70 29 L68 53 Z" stroke-width="3"/>
    <circle class="pink cat-line" cx="52" cy="41" r="6" stroke-width="3"/>
    <ellipse class="cat-pink" cx="60" cy="118" rx="12" ry="7" opacity=".85"/>
    <ellipse class="cat-pink" cx="140" cy="118" rx="12" ry="7" opacity=".85"/>
    <path class="cat-line" d="M24 104 L44 108 M24 116 L44 114 M176 104 L156 108 M176 116 L156 114" stroke-width="3"/>
    <path class="cat-pink cat-line" d="M95 106 L105 106 L100 112 Z" stroke-width="2.5"/>
    <path class="cat-line" d="M62 98 Q72 85 82 98 M118 98 Q128 85 138 98" fill="none" stroke-width="5"/>
    <path class="cat-line" d="M86 116 Q93 126 100 116 Q107 126 114 116" fill="none" stroke-width="3.5"/>
    <path class="gold cat-line" d="M182 26 L185 36 L195 39 L185 42 L182 52 L179 42 L169 39 L179 36 Z" stroke-width="2.5"/>
  </g>

  <!-- Pipeline -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8">
    <path class="soft-s" d="M282 284 L330 284" marker-end="url(#soft-head)"/>
    <path class="soft-s" d="M558 284 L606 284" marker-end="url(#soft-head)"/>
    <path class="soft-s" d="M834 284 L882 284" marker-end="url(#soft-head)"/>
    <path class="soft-s" d="M1110 284 L1158 284" marker-end="url(#soft-head)"/>
  </g>
  <g>
    <rect class="shadow" x="64" y="206" width="208" height="168" rx="22"/>
    <rect class="card frame" x="64" y="200" width="208" height="168" rx="22" stroke-width="2.5"/>
    <rect class="lilac" x="84" y="218" width="30" height="30" rx="10"/><text class="pop" x="99" y="238" font-size="13" text-anchor="middle" fill="#fff">01</text>
    <text class="pop ink" x="84" y="278" font-size="19">Gather</text>
    <text class="ink-2" font-size="14"><tspan x="84" y="306">The diff, the ticket</tspan><tspan x="84" dy="20">as the spec, and a</tspan><tspan x="84" dy="20">checkout of the head.</tspan></text>
  </g>
  <g>
    <rect class="shadow" x="340" y="206" width="208" height="168" rx="22"/>
    <rect class="card frame" x="340" y="200" width="208" height="168" rx="22" stroke-width="2.5"/>
    <rect class="lilac" x="360" y="218" width="30" height="30" rx="10"/><text class="pop" x="375" y="238" font-size="13" text-anchor="middle" fill="#fff">02</text>
    <text class="pop ink" x="360" y="278" font-size="19">Map</text>
    <text class="ink-2" font-size="14"><tspan x="360" y="306">Sort hunks into</tspan><tspan x="360" dy="20">chapters, rated from</tspan><tspan x="360" dy="20"><tspan class="gold">★★★</tspan> boss to <tspan class="gold">★</tspan> easy.</tspan></text>
  </g>
  <g>
    <rect class="pink-deep" x="616" y="206" width="208" height="168" rx="22"/>
    <rect class="pink" x="616" y="200" width="208" height="168" rx="22"/>
    <rect class="on-pink" x="636" y="218" width="30" height="30" rx="10"/><text class="pop pink" x="651" y="238" font-size="13" text-anchor="middle">03</text>
    <text class="pop on-pink" x="636" y="278" font-size="19">Prove</text>
    <text class="m on-pink" font-size="14"><tspan x="636" y="306">Run the specs. Break</tspan><tspan x="636" dy="20">the fix on purpose.</tspan><tspan x="636" dy="20">Read the callers.</tspan></text>
  </g>
  <g>
    <rect class="shadow" x="892" y="206" width="208" height="168" rx="22"/>
    <rect class="card frame" x="892" y="200" width="208" height="168" rx="22" stroke-width="2.5"/>
    <rect class="lilac" x="912" y="218" width="30" height="30" rx="10"/><text class="pop" x="927" y="238" font-size="13" text-anchor="middle" fill="#fff">04</text>
    <text class="pop ink" x="912" y="278" font-size="19">Question</text>
    <text class="ink-2" font-size="14"><tspan x="912" y="306">What the code can't</tspan><tspan x="912" dy="20">answer, who can, and</tspan><tspan x="912" dy="20">what blocks the merge.</tspan></text>
  </g>
  <g>
    <rect class="shadow" x="1168" y="206" width="208" height="168" rx="22"/>
    <rect class="card frame" x="1168" y="200" width="208" height="168" rx="22" stroke-width="2.5"/>
    <rect class="lilac" x="1188" y="218" width="30" height="30" rx="10"/><text class="pop" x="1203" y="238" font-size="13" text-anchor="middle" fill="#fff">05</text>
    <text class="pop ink" x="1188" y="278" font-size="19">Build</text>
    <text class="ink-2" font-size="14"><tspan x="1188" y="306">tour.json and the real</tspan><tspan x="1188" dy="20">diff become one page,</tspan><tspan x="1188" dy="20">narrated by Mochi.</tspan></text>
  </g>

  <!-- Mutation check -->
  <path class="pink-s" d="M720 380 L720 454" fill="none" stroke-width="3" stroke-linecap="round" marker-end="url(#pink-head)"/>
  <g fill="none" stroke="#8B7DB0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M830 512 L882 512" marker-end="url(#ink-head)"/>
    <path d="M1106 512 L1134 512 M1134 456 L1134 576"/>
    <path d="M1134 456 L1158 456" marker-end="url(#ink-head)"/>
    <path d="M1134 576 L1158 576" marker-end="url(#ink-head)"/>
  </g>
  <rect class="pink-shadow" x="616" y="469" width="208" height="96" rx="20"/>
  <rect class="card pink-s" x="616" y="464" width="208" height="96" rx="20" stroke-width="2.5"/>
  <text class="ink" font-size="15" text-anchor="middle"><tspan class="b" x="720" y="507">Break one line</tspan><tspan x="720" dy="22">of the fix</tspan></text>
  <rect class="pink-shadow" x="892" y="469" width="208" height="96" rx="20"/>
  <rect class="card pink-s" x="892" y="464" width="208" height="96" rx="20" stroke-width="2.5"/>
  <text class="ink" font-size="15" text-anchor="middle"><tspan class="b" x="996" y="507">Rerun the specs</tspan><tspan x="996" dy="22">that cover it</tspan></text>
  <text class="b ink-3" x="996" y="596" font-size="13" text-anchor="middle">Then the fix is restored ✿</text>

  <rect class="proof-soft" x="1168" y="412" width="208" height="88" rx="18"/>
  <text font-size="14.5"><tspan class="b proof" x="1186" y="446">✦ A test goes red</tspan><tspan class="ink" x="1186" dy="22">Mutant caught! The fix</tspan><tspan class="ink" x="1186" dy="20">is guarded.</tspan></text>
  <rect class="gap-soft gap-s" x="1168" y="532" width="208" height="88" rx="18" stroke-width="2"/>
  <text font-size="14.5"><tspan class="b gap" x="1186" y="566">! All tests stay green</tspan><tspan class="ink" x="1186" dy="22">Mutant escaped.</tspan><tspan class="ink" x="1186" dy="20">That's a test gap.</tspan></text>
  <text class="m ink-2" x="616" y="676" font-size="14">Chapter 03 in detail: green after breaking the fix means no test guards that line.</text>

  <!-- Evidence tags -->
  <rect class="shadow" x="64" y="430" width="484" height="312" rx="22"/>
  <rect class="card frame" x="64" y="424" width="484" height="312" rx="22" stroke-width="2.5"/>
  <text class="pop ink" x="92" y="466" font-size="17">Tags on every claim</text>
  <g font-size="13">
    <rect class="proof-soft" x="92" y="490" width="200" height="30" rx="15"/><circle class="proof" cx="108" cy="505" r="11"/><text class="b on-dot" x="108" y="510" text-anchor="middle" font-size="12">✓</text>
    <text class="b proof" x="126" y="510">Proven · ran</text><text class="ink" x="308" y="510" font-size="15">Tests run on the PR head</text>
    <rect class="proof-soft" x="92" y="534" width="200" height="30" rx="15"/><circle class="proof" cx="108" cy="549" r="11"/><text class="b on-dot" x="108" y="554" text-anchor="middle" font-size="12">✦</text>
    <text class="b proof" x="126" y="554">Mutant caught!</text><text class="ink" x="308" y="554" font-size="15">A test noticed the broken fix</text>
    <rect class="gap-soft gap-s" x="92" y="578" width="200" height="30" rx="15" stroke-width="2"/><circle class="gap" cx="108" cy="593" r="11"/><text class="b on-dot" x="108" y="598" text-anchor="middle" font-size="12">!</text>
    <text class="b gap" x="126" y="598">Mutant escaped!</text><text class="ink" x="308" y="598" font-size="15">No test noticed: a gap</text>
    <rect class="gap-s" x="92" y="622" width="200" height="30" rx="15" fill="none" stroke-width="2" stroke-dasharray="5 4"/><circle class="gap" cx="108" cy="637" r="11"/><text class="b on-dot" x="108" y="642" text-anchor="middle" font-size="12">?</text>
    <text class="b gap" x="126" y="642">Hearsay · not rerun</text><text class="ink" x="308" y="642" font-size="15">From the PR body only</text>
    <rect class="read-soft read-s" x="92" y="666" width="200" height="30" rx="15" stroke-width="2"/><circle class="ink-3" cx="108" cy="681" r="11"/><text class="b on-dot" x="108" y="686" text-anchor="middle" font-size="12">◎</text>
    <text class="b ink-2" x="126" y="686">Read by hand</text><text class="ink" x="308" y="686" font-size="15">Code the agent checked itself</text>
  </g>
</svg>
